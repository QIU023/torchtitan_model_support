# Phase 14 on a Together GPU cluster (Kubernetes): one pod per 8-GPU node, 2, 4 or 8 of them, all mounting the
# cluster's shared volume (together/README.md). Apply with kit/k8s.sh apply <2|4|8>, which sets the node count below.
# Before applying: set volumeName to your shared volume's name (kubectl get pv; Together creates a static PV with the
# same name as the shared volume), HW (h100 / h200 / b200 / b300) and the MN_* settings.
# Each pod clones the kit onto the shared volume once, then runs kit/bootstrap.sh: packages, the shared setup, and
# the unattended pipeline, which resumes where it stopped after a preemption (state on the shared volume). The
# Indexed Job gives the pods JOB_COMPLETION_INDEX (the node rank) and hostnames p14-0, p14-1, ...; the headless
# Service p14 makes p14-0.p14 resolvable (MASTER_ADDR). The GPU nodes offer the network operator's rdma/infiniband
# resource; the pod takes one and is privileged so NCCL reaches the HCAs; every run records which transport NCCL took.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p14-shared
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
  volumeName: aaa  # your shared volume (kubectl get pv)
---
apiVersion: v1
kind: Service
metadata:
  name: p14
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: p14
---
apiVersion: batch/v1
kind: Job
metadata:
  name: p14
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  # Preempted pods are replaced when Together brings a node back; the pipeline state lives on the shared volume.
  backoffLimit: 1000
  template:
    spec:
      subdomain: p14
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Pin to the preemptible nodes if the cluster also has a standard node:
      # nodeSelector:
      #   together.ai/compute-class: preemptible
      # If the comm task reports "InfiniBand: NO", try the node's network namespace (then set MN_IFNAME below to the
      # node interface that `ip -4 addr` shows inside the pod):
      # hostNetwork: true
      # dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: main
        image: nvidia/cuda:12.8.1-devel-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
          mkdir -p $MN_BASE
          L=$MN_BASE/logbook
          if [ ! -d $L/.git ]; then
            rm -rf $L.tmp.$HOSTNAME
            git clone --depth 1 --filter=blob:none --sparse https://github.com/QIU023/torchtitan_model_support.git $L.tmp.$HOSTNAME
            git -C $L.tmp.$HOSTNAME sparse-checkout set phase14_multinode_5D_experiments
            mv -T $L.tmp.$HOSTNAME $L || rm -rf $L.tmp.$HOSTNAME
          fi
          # A new k8s.sh apply (new MN_APPLY_ID) takes the kit from GitHub main and drops the previous run's scope.env
          # and STOP, which a reused volume still holds; a pod restarted after preemption keeps all three.
          if [ -n "${MN_APPLY_ID:-}" ]; then
            exec 9> $MN_BASE/.apply_lock
            flock 9
            if [ "$(cat $MN_BASE/apply_id 2>/dev/null)" != "$MN_APPLY_ID" ]; then
              git -C $L fetch -q --depth 1 origin main && git -C $L reset -q --hard FETCH_HEAD \
                || echo "kit update from GitHub failed, keeping $(git -C $L log -1 --format=%h)"
              rm -f $MN_BASE/scope.env $MN_BASE/STOP
              echo "$MN_APPLY_ID" > $MN_BASE/apply_id
            fi
            exec 9>&-
          fi
          echo "kit at $(git -C $L log -1 --format='%h %cd' --date=short)"
          exec bash $L/phase14_multinode_5D_experiments/kit/bootstrap.sh
        env:
        - name: HW
          value: h100
        # Node count, with completions and parallelism above: k8s.sh apply <2|4|8> sets all three.
        - name: NNODES
          value: "2"
        - name: MN_NET
          value: together
        - name: MN_BASE
          value: /mnt/shared/p14
        # Set by k8s.sh apply at every apply (see the start command above); empty keeps the volume's kit and scope.
        - name: MN_APPLY_ID
          value: ""
        - name: MASTER_ADDR
          value: p14-0.p14
        # The 2026-11-08 fast path: after setup, measure every K3 row once (5 steps, profiler trace at step 5) at 16K,
        # eager (no compile), VPP 2; a row that runs out of memory retries at half the length. About 4 minutes a row.
        # Each run's NCCL INFO files show the transport (summarize.py's net column), so no separate comm check runs.
        # Full study instead: MN_STAGES "smoke probe warm measure", MN_COMM "1", drop MN_SEQ_FORCE (PLAYBOOK.md).
        - name: MN_MODELS
          value: "k3"
        # Empty runs every matrix row but the +optional ones; "k3_A k3_C" only those; "+core" the rows tagged so (k8s.sh
        # apply 8 +core); "none" only setup and the tokenizers.
        - name: MN_ROWS
          value: ""
        # "1" checks every GPU's GEMM rate, each IB port's RDMA and NCCL over all GPUs before the matrix and stops when
        # one fails; "warn" only reports; "0" skips it (on 4 nodes on 11-17 its NCCL part had not finished after 7 min).
        - name: MN_PREFLIGHT
          value: "1"
        - name: MN_STAGES
          value: "measure"
        - name: MN_COMM
          value: "0"
        - name: MN_SEQ_FORCE
          value: "16384"
        # "1" compiles every row (a cold compile per layout; launch.sh raises the first-step NCCL timeout), "0" runs
        # eager; with "1" the rows that only switch compile on are skipped.
        - name: MN_COMPILE
          value: "0"
        - name: MN_VPP
          value: "2"
        - name: MEAS_STEPS
          value: "5"
        - name: PROFILE_FREQ
          value: "5"
        - name: MN_ORDER
          value: row
        # Communication libraries to build after setup (ext_build.sh), e.g. "hybridep" for the +ep_backend rows;
        # node 0 builds each once onto the shared volume.
        - name: MN_EP_LIBS
          value: ""
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          limits:
            nvidia.com/gpu: 8
            rdma/infiniband: 1
          requests:
            nvidia.com/gpu: 8
            rdma/infiniband: 1
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: shared
          mountPath: /mnt/shared
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: shared
        persistentVolumeClaim:
          claimName: p14-shared
