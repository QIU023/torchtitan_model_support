# Phase 14 on a Together GPU cluster (Kubernetes): two pods, one per 8-GPU node, both mounting the cluster's shared
# volume (together/README.md). kubectl apply -f p14_pods.yaml
# Before applying: set volumeName to your shared volume's name (kubectl get pv; Together creates a static PV with the
# same name as the shared volume), HW (h100 / h200 / b200) and the MN_* settings.
# Each pod clones the kit onto the shared volume once, then runs kit/bootstrap.sh: packages, the shared setup, and
# the unattended pipeline, which resumes where it stopped after a preemption (state on the shared volume). The
# Indexed Job gives the pods JOB_COMPLETION_INDEX (0 / 1 = node rank) and hostnames p14-0 / p14-1; the headless
# Service p14 makes p14-0.p14 resolvable (MASTER_ADDR). The GPU nodes offer the network operator's rdma/infiniband
# resource; the pod takes one and is privileged so NCCL reaches the HCAs; every run records which transport NCCL took.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p14-shared
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
  volumeName: aaa  # your shared volume (kubectl get pv)
---
apiVersion: v1
kind: Service
metadata:
  name: p14
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: p14
---
apiVersion: batch/v1
kind: Job
metadata:
  name: p14
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  # Preempted pods are replaced when Together brings a node back; the pipeline state lives on the shared volume.
  backoffLimit: 1000
  template:
    spec:
      subdomain: p14
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Pin to the preemptible nodes if the cluster also has a standard node:
      # nodeSelector:
      #   together.ai/compute-class: preemptible
      # If the comm task reports "InfiniBand: NO", try the node's network namespace (then set MN_IFNAME below to the
      # node interface that `ip -4 addr` shows inside the pod):
      # hostNetwork: true
      # dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: main
        image: nvidia/cuda:12.8.1-devel-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
          mkdir -p $MN_BASE
          L=$MN_BASE/logbook
          if [ ! -d $L/.git ]; then
            rm -rf $L.tmp.$HOSTNAME
            git clone --depth 1 --filter=blob:none --sparse https://github.com/QIU023/torchtitan_model_support.git $L.tmp.$HOSTNAME
            git -C $L.tmp.$HOSTNAME sparse-checkout set phase14_multinode_5D_experiments
            mv -T $L.tmp.$HOSTNAME $L || rm -rf $L.tmp.$HOSTNAME
          fi
          exec bash $L/phase14_multinode_5D_experiments/kit/bootstrap.sh
        env:
        - name: HW
          value: h100
        - name: MN_NET
          value: together
        - name: MN_BASE
          value: /mnt/shared/p14
        - name: MASTER_ADDR
          value: p14-0.p14
        # The 2026-11-08 fast path: after setup, measure every K3 row once (5 steps, profiler trace at step 5) at 16K,
        # eager (no compile), VPP 2; a row that runs out of memory retries at half the length. About 4 minutes a row.
        # Each run's NCCL INFO files show the transport (summarize.py's net column), so no separate comm check runs.
        # Full study instead: MN_STAGES "smoke probe warm measure", MN_COMM "1", drop MN_SEQ_FORCE (PLAYBOOK.md).
        - name: MN_MODELS
          value: "k3"
        # Empty runs every matrix row; "k3_A k3_C" only those; "none" only setup and the tokenizers.
        - name: MN_ROWS
          value: ""
        - name: MN_STAGES
          value: "measure"
        - name: MN_COMM
          value: "0"
        - name: MN_SEQ_FORCE
          value: "16384"
        - name: MN_COMPILE
          value: "0"
        - name: MN_VPP
          value: "2"
        - name: MEAS_STEPS
          value: "5"
        - name: PROFILE_FREQ
          value: "5"
        - name: MN_ORDER
          value: row
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          limits:
            nvidia.com/gpu: 8
            rdma/infiniband: 1
          requests:
            nvidia.com/gpu: 8
            rdma/infiniband: 1
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: shared
          mountPath: /mnt/shared
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: shared
        persistentVolumeClaim:
          claimName: p14-shared
