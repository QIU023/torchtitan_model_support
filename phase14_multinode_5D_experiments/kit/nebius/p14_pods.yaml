# Phase 14 on Nebius Managed Kubernetes: one pod per node (2, 4 or 8), on a node group attached to a GPU cluster
# (InfiniBand) and to a shared filesystem (nebius/README.md, steps 1-2).
# Each pod clones the kit onto the shared filesystem once, then runs kit/bootstrap.sh: packages, the shared setup,
# and the unattended pipeline, which resumes where it stopped after a preemption (state on the shared filesystem).
# The Indexed Job gives the pods JOB_COMPLETION_INDEX (the node rank) and hostnames p14-0, p14-1, ...; the headless
# Service p14 makes p14-0.p14 resolvable (MASTER_ADDR). The container is privileged so NCCL reaches the mlx5 HCAs,
# as in Nebius's NCCL test; env.sh hands NCCL only the InfiniBand ports (B300 nodes also carry a BlueField-3 front-end
# adapter). Set HW (h100 / h200 / b200 / b300) and the resources below for the node group's preset before applying
# with kit/k8s.sh apply <2|4|8> [rows] nebius/p14_pods.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p14-shared
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 500Gi
  storageClassName: csi-mounted-fs-path-sc
---
apiVersion: v1
kind: Service
metadata:
  name: p14
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: p14
---
apiVersion: batch/v1
kind: Job
metadata:
  name: p14
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  # Preempted pods are replaced; the pipeline state lives on the shared filesystem.
  backoffLimit: 1000
  template:
    spec:
      subdomain: p14
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: main
        image: nvidia/cuda:12.8.1-devel-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
          mkdir -p $MN_BASE
          L=$MN_BASE/logbook
          if [ ! -d $L/.git ]; then
            rm -rf $L.tmp.$HOSTNAME
            git clone --depth 1 --filter=blob:none --sparse https://github.com/QIU023/torchtitan_model_support.git $L.tmp.$HOSTNAME
            git -C $L.tmp.$HOSTNAME sparse-checkout set phase14_multinode_5D_experiments
            mv -T $L.tmp.$HOSTNAME $L || rm -rf $L.tmp.$HOSTNAME
          fi
          # A new k8s.sh apply (new MN_APPLY_ID) takes the kit from GitHub main and drops the previous run's scope.env
          # and STOP, which a reused volume still holds; a pod restarted after preemption keeps all three.
          if [ -n "${MN_APPLY_ID:-}" ]; then
            exec 9> $MN_BASE/.apply_lock
            flock 9
            if [ "$(cat $MN_BASE/apply_id 2>/dev/null)" != "$MN_APPLY_ID" ]; then
              git -C $L fetch -q --depth 1 origin main && git -C $L reset -q --hard FETCH_HEAD \
                || echo "kit update from GitHub failed, keeping $(git -C $L log -1 --format=%h)"
              rm -f $MN_BASE/scope.env $MN_BASE/STOP
              echo "$MN_APPLY_ID" > $MN_BASE/apply_id
            fi
            exec 9>&-
          fi
          echo "kit at $(git -C $L log -1 --format='%h %cd' --date=short)"
          exec bash $L/phase14_multinode_5D_experiments/kit/bootstrap.sh
        env:
        - name: HW
          value: b300
        # Node count, with completions and parallelism above: k8s.sh apply <2|4|8> sets all three.
        - name: NNODES
          value: "2"
        - name: MN_NET
          value: nebius
        - name: MN_BASE
          value: /mnt/shared/p14
        # Set by k8s.sh apply at every apply (see the start command above); empty keeps the volume's kit and scope.
        - name: MN_APPLY_ID
          value: ""
        - name: MASTER_ADDR
          value: p14-0.p14
        # The fast path (PLAYBOOK.md section 0): after setup, measure every K3 row once at 16K, VPP 2, 5 steps with a
        # trace at step 5. On a card type the kit has not run on yet (B300), "smoke measure" first checks that every
        # layout starts on the debug model.
        - name: MN_MODELS
          value: "k3"
        # Empty runs every row but the +optional ones; "+core" the rows tagged so; "+all +ep_backend" adds HybridEP.
        - name: MN_ROWS
          value: ""
        # "warn" reports the preflight without stopping: on 800G ports its network thresholds are the 400G ones scaled
        # by the link rate, not yet measured; "1" stops before the matrix when a check fails.
        - name: MN_PREFLIGHT
          value: "warn"
        - name: MN_STAGES
          value: "measure"
        - name: MN_COMM
          value: "0"
        - name: MN_SEQ_FORCE
          value: "16384"
        # "1" compiles every row (a cold compile per layout; launch.sh raises the first-step NCCL timeout), "0" runs
        # eager; with "1" the rows that only switch compile on are skipped.
        - name: MN_COMPILE
          value: "0"
        - name: MN_VPP
          value: "2"
        - name: MEAS_STEPS
          value: "5"
        - name: PROFILE_FREQ
          value: "5"
        - name: MN_ORDER
          value: row
        # Communication libraries to build after setup (ext_build.sh), e.g. "hybridep".
        - name: MN_EP_LIBS
          value: ""
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        # Sized for the B300 preset 8gpu-192vcpu-2768gb; the H200 preset 8gpu-128vcpu-1600gb takes cpu 96, memory 1200Gi.
        resources:
          limits:
            nvidia.com/gpu: 8
            cpu: 160
            memory: 2400Gi
          requests:
            nvidia.com/gpu: 8
            cpu: 160
            memory: 2400Gi
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: shared
          mountPath: /mnt/shared
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: shared
        persistentVolumeClaim:
          claimName: p14-shared
