# Two pods for the phase 14 kit, one per node, on a Nebius Managed Kubernetes node group attached to a GPU cluster
# (InfiniBand). kubectl apply -f p14_pods.yaml; delete with kubectl delete -f p14_pods.yaml (pods lose their files).
# An Indexed Job gives the pods JOB_COMPLETION_INDEX (0 / 1 = node rank) and hostnames p14-0 / p14-1; the headless
# Service p14 makes p14-0.p14 resolvable, which is MASTER_ADDR. Rendezvous and NCCL bootstrap run on the pod
# network (eth0); NCCL data runs on the mlx5 HCAs, reachable because the container is privileged (as in Nebius's
# NCCL test). Each container clones the kit, runs setup.sh, then idles; work is started with kit/nebius/k8s.sh.
apiVersion: v1
kind: Service
metadata:
  name: p14
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: p14
---
apiVersion: batch/v1
kind: Job
metadata:
  name: p14
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 0
  template:
    spec:
      subdomain: p14
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: main
        image: nvidia/cuda:12.8.1-devel-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
          git clone --depth 1 --filter=blob:none --sparse https://github.com/QIU023/torchtitan_model_support.git /root/logbook
          git -C /root/logbook sparse-checkout set phase14_multinode_5D_experiments
          bash /root/logbook/phase14_multinode_5D_experiments/kit/setup.sh
          sleep infinity
        env:
        - name: HW
          value: h100
        - name: MN_NET
          value: nebius
        - name: MN_BASE
          value: /root/p14
        - name: MASTER_ADDR
          value: p14-0.p14
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          limits:
            nvidia.com/gpu: 8
            cpu: 96
            memory: 1200Gi
          requests:
            nvidia.com/gpu: 8
            cpu: 96
            memory: 1200Gi
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: work
          mountPath: /root/p14
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: work
        emptyDir: {}
