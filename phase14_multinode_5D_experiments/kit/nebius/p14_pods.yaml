# Phase 14 on Nebius Managed Kubernetes: two pods, one per node, on a node group attached to a GPU cluster
# (InfiniBand) and to a shared filesystem (nebius/README.md, steps 1-2). kubectl apply -f p14_pods.yaml
# Each pod clones the kit onto the shared filesystem once, then runs kit/bootstrap.sh: packages, the shared setup,
# and the unattended pipeline, which resumes where it stopped after a preemption (state on the shared filesystem).
# The Indexed Job gives the pods JOB_COMPLETION_INDEX (0 / 1 = node rank) and hostnames p14-0 / p14-1; the headless
# Service p14 makes p14-0.p14 resolvable (MASTER_ADDR). The container is privileged so NCCL reaches the mlx5 HCAs,
# as in Nebius's NCCL test. Edit HW (h100 / h200 / b200) and the MN_* settings below before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p14-shared
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 500Gi
  storageClassName: csi-mounted-fs-path-sc
---
apiVersion: v1
kind: Service
metadata:
  name: p14
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: p14
---
apiVersion: batch/v1
kind: Job
metadata:
  name: p14
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  # Preempted pods are replaced; the pipeline state lives on the shared filesystem.
  backoffLimit: 1000
  template:
    spec:
      subdomain: p14
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: main
        image: nvidia/cuda:12.8.1-devel-ubuntu22.04
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -x
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
          mkdir -p $MN_BASE
          L=$MN_BASE/logbook
          if [ ! -d $L/.git ]; then
            rm -rf $L.tmp.$HOSTNAME
            git clone --depth 1 --filter=blob:none --sparse https://github.com/QIU023/torchtitan_model_support.git $L.tmp.$HOSTNAME
            git -C $L.tmp.$HOSTNAME sparse-checkout set phase14_multinode_5D_experiments
            mv -T $L.tmp.$HOSTNAME $L || rm -rf $L.tmp.$HOSTNAME
          fi
          exec bash $L/phase14_multinode_5D_experiments/kit/bootstrap.sh
        env:
        - name: HW
          value: h200
        - name: MN_NET
          value: nebius
        - name: MN_BASE
          value: /mnt/shared/p14
        - name: MASTER_ADDR
          value: p14-0.p14
        # Pipeline scope: empty MN_ROWS runs every matrix row; MN_ROWS=k3_5d runs the 5D cell through all stages.
        - name: MN_MODELS
          value: "k3 m3"
        - name: MN_ROWS
          value: ""
        - name: MN_ORDER
          value: row
        # "0" leaves out the NCCL tuning runs of comm_sweep.tsv after the matrix (about 20 minutes).
        - name: MN_COMM_SWEEP
          value: "1"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        resources:
          limits:
            nvidia.com/gpu: 8
            cpu: 96
            memory: 1200Gi
          requests:
            nvidia.com/gpu: 8
            cpu: 96
            memory: 1200Gi
        securityContext:
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: shared
          mountPath: /mnt/shared
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: shared
        persistentVolumeClaim:
          claimName: p14-shared
